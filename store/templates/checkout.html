<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans antialiased">

    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 relative overflow-hidden">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-lock text-blue-600 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800">Secure Checkout</h1>
            <p class="text-slate-500 mt-2 text-sm">Order Reference #<span id="order-id" class="font-bold text-slate-700">{{ order.id }}</span></p>
        </div>

        <!-- ========================================== -->
        <!-- SECURITY LAYER 1: SERVER-SIDE RENDER BLOCK -->
        <!-- ========================================== -->
        {% if order.payment_status == 'C' %}
            
            <!-- Success State: No buttons are rendered -->
            <div class="text-center py-4">
                <div class="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-check text-3xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">Payment Completed</h2>
                <p class="text-slate-600 text-sm mb-6">This order has been fully paid and secured on the ledger.</p>
            </div>

        {% else %}

            <!-- Pending State: Buttons are rendered -->
            <div class="space-y-4" id="payment-buttons">
                
                <button onclick="payWithStripe()" id="stripe-btn" class="w-full flex items-center justify-center gap-3 bg-[#635BFF] text-white py-3.5 px-4 rounded-xl font-semibold hover:bg-[#524be0] transition-all focus:ring-4 focus:ring-[#635BFF]/30">
                    <i class="fa-regular fa-credit-card text-lg"></i>
                    <span>Pay with Card (Stripe)</span>
                </button>

                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold uppercase">Or</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <button onclick="payWithCrypto()" id="crypto-btn" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 text-slate-700 py-3.5 px-4 rounded-xl font-semibold hover:border-[#F6851B] hover:text-[#F6851B] transition-all">
                    <i class="fa-brands fa-ethereum text-xl"></i>
                    <span>Pay with MetaMask</span>
                </button>
            </div>

            <!-- Status Updates -->
            <div id="status-container" class="hidden mt-6 text-center bg-slate-50 rounded-xl p-5 border border-slate-100">
                <div id="loading-spinner" class="hidden justify-center mb-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-2xl"></i>
                </div>
                <p id="status-message" class="text-sm font-semibold text-slate-600"></p>
            </div>

        {% endif %}
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT: THE CLIENT-SIDE LOGIC          -->
    <!-- ========================================== -->
    <script>
        // --- 1. CSRF Token Fetcher ---
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // --- 2. UI State Manager ---
        function setUIState(message, isLoading, isError = false) {
            const statusContainer = document.getElementById('status-container');
            const statusMessage = document.getElementById('status-message');
            const spinner = document.getElementById('loading-spinner');
            const stripeBtn = document.getElementById('stripe-btn');
            const cryptoBtn = document.getElementById('crypto-btn');

            if(!statusContainer) return;
            statusContainer.classList.remove('hidden');
            statusMessage.innerText = message;
            
            if (isLoading) {
                spinner.classList.remove('hidden');
                spinner.classList.add('flex');
                statusMessage.className = "text-sm font-semibold text-blue-600";
                if(stripeBtn) { stripeBtn.disabled = true; stripeBtn.classList.add('opacity-50', 'cursor-not-allowed'); }
                if(cryptoBtn) { cryptoBtn.disabled = true; cryptoBtn.classList.add('opacity-50', 'cursor-not-allowed'); }
            } else {
                spinner.classList.add('hidden');
                spinner.classList.remove('flex');
                if (isError) {
                    statusMessage.className = "text-sm font-semibold text-red-600";
                    if(stripeBtn) { stripeBtn.disabled = false; stripeBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }
                    if(cryptoBtn) { cryptoBtn.disabled = false; cryptoBtn.classList.remove('opacity-50', 'cursor-not-allowed'); }
                } else {
                    statusMessage.className = "text-sm font-bold text-green-600";
                }
            }
        }

                // --- 3. SECURITY LAYER 2: PRE-FLIGHT API CHECK ---
        async function isOrderAlreadyPaid(orderId) {
            try {
                const response = await fetch(`/store/orders/${orderId}/`, {
                    method: 'GET',
                    headers: { 
                        'Accept': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin' // <-- Forces JS to send your admin login cookie
                });
                
                if (!response.ok) return false; 
                
                const data = await response.json();
                return data.payment_status === 'C';
            } catch (e) {
                return false;
            }
        }

        // --- 4. STRIPE IMPLEMENTATION ---
        window.payWithStripe = async function() {
            const orderId = document.getElementById('order-id').innerText;
            setUIState("Securing checkout...", true);

            // PRE-FLIGHT CHECK
            if (await isOrderAlreadyPaid(orderId)) {
                setUIState("Order is already paid! Reloading...", false, true);
                setTimeout(() => window.location.reload(), 2000);
                return; // ABORT!
            }

            try {
                const response = await fetch(`/store/orders/${orderId}/checkout/`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') 
                    }
                });
                const data = await response.json();
                
                if (data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    setUIState(data.error || "Stripe initialization failed.", false, true);
                }
            } catch (error) {
                setUIState("Server error.", false, true);
            }
        };

        // --- 5. METAMASK IMPLEMENTATION ---
        window.payWithCrypto = async function() {
            const orderId = document.getElementById('order-id').innerText;
            
            if (typeof window.ethereum === 'undefined') {
                setUIState("MetaMask not found. Please install the browser extension.", false, true);
                return;
            }

            setUIState("Verifying transaction integrity...", true);

            // PRE-FLIGHT CHECK (This strictly prevents double-spends)
            if (await isOrderAlreadyPaid(orderId)) {
                setUIState("This order is already completed! Reloading UI...", false, true);
                setTimeout(() => window.location.reload(), 2000);
                return; // ABORT! MetaMask will never open.
            }

            try {
                setUIState("Awaiting your approval in MetaMask...", true);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const senderAddress = accounts[0];

                const txParams = {
                    to: senderAddress, // POC: Sending to yourself
                    from: senderAddress,
                    value: '0x38D7EA4C68000', // 0.001 ETH
                };

                // The user confirms the transaction here
                const txHash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [txParams],
                });

                setUIState("Transaction sent! Verifying on the blockchain (takes ~15s)...", true);

                // Hand off to Django for Web3.py verification
                const verifyResponse = await fetch(`/store/orders/${orderId}/verify_crypto_payment/`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') 
                    },
                    body: JSON.stringify({ tx_hash: txHash })
                });

                const verifyData = await verifyResponse.json();

                if (verifyResponse.ok) {
                    setUIState("✅ Payment Confirmed! Reloading...", false);
                    setTimeout(() => window.location.reload(), 2000);
                } else {
                    setUIState(verifyData.error || "Backend verification failed.", false, true);
                }

            } catch (error) {
                if (error.code === 4001) {
                    setUIState("Transaction cancelled by user.", false, true);
                } else {
                    setUIState("An unexpected error occurred.", false, true);
                    console.error(error);
                }
            }
        };
    </script>
</body>
</html>
