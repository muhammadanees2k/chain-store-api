# docker-compose.yml
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: storefront3
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    # PRODUCTION GRADE: Gunicorn instead of runserver, binding to port 8000 internally
    command: gunicorn chainstore.wsgi:application --bind 0.0.0.0:8000
    restart: always
    volumes:
      - .:/app
    ports:
      - "80:8000" # Maps AWS port 80 to container port 8000
    environment:
      - DJANGO_SETTINGS_MODULE=chainstore.settings.prod # Forces prod settings!
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data: